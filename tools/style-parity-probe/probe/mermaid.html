<!doctype html><html><head><meta charset="utf-8"><title>Sonde de style mermaid</title></head><body>
<div id="out"></div>
<script type="module">
import mermaid from '/node_modules/mermaid/dist/mermaid.esm.min.mjs';
mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });

// Un style DS plausible poussé vers mermaid par classDef, plus des formes C4/archi.
const def = `flowchart LR
  A@{ shape: rounded, label: "Service" }
  B@{ shape: cyl, label: "Base" }
  C@{ shape: bucket, label: "Bucket" }
  D@{ shape: hex, label: "Passerelle" }
  E@{ shape: rect, label: "Carre" }
  A --> B
  A --> C
  D --> A
  E --> A
  classDef dsCard fill:#eef2ff,stroke:#4f46e5,stroke-width:2px,color:#1e1b4b,font-size:12px,font-weight:600,rx:8,ry:8,stroke-dasharray:4 2,text-align:center,padding:12px,font-family:Inter
  class A,B,C,D,E dsCard
`;
const { svg } = await mermaid.render('g1', def);
document.getElementById('out').innerHTML = svg;

const probe = (sel) => {
  const node = document.querySelector(sel);
  if (!node) return { trouve: false };
  const shape = node.querySelector('path, rect, polygon, ellipse, circle');
  const label = node.querySelector('.nodeLabel, foreignObject span, text');
  const cs = shape ? getComputedStyle(shape) : null;
  const ls = label ? getComputedStyle(label) : null;
  return {
    trouve: true,
    formeTag: shape ? shape.tagName : null,
    fill: cs?.fill, stroke: cs?.stroke, strokeWidth: cs?.strokeWidth, strokeDasharray: cs?.strokeDasharray,
    rxAttr: shape?.getAttribute?.('rx') ?? null,
    couleurTexte: ls?.color, tailleTexte: ls?.fontSize, graisseTexte: ls?.fontWeight,
    familleTexte: ls?.fontFamily?.slice(0, 40), alignementTexte: ls?.textAlign
  };
};
window.__out = {
  versionMermaid: mermaid.version ? mermaid.version() : 'inconnue',
  nodes: Object.fromEntries([...document.querySelectorAll('.node')].map((n) => [n.id.replace(/^g1-flowchart-/, '').replace(/-\d+$/, ''), probe('#' + CSS.escape(n.id))])),
  idsPresents: [...document.querySelectorAll('.node')].map((n) => n.id).slice(0, 10),
  svgTaille: svg.length
};
window.__done = true;
</script></body></html>
