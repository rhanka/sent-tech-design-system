<!doctype html><html><head><meta charset="utf-8"><title>Mesure navigateur</title>
<style>@font-face { font-family: 'SondeDS'; src: url('/DejaVuSans.ttf') format('truetype'); }</style></head>
<body><svg id="s" width="10" height="10"><text id="t"></text></svg>
<script type="module">
const strings = await (await fetch('/strings.json')).json();
await document.fonts.load('14px SondeDS');
await document.fonts.ready;
const ctx = document.createElement('canvas').getContext('2d');
const t = document.getElementById('t');
const out = { canvas: {}, svg: {} };
for (const size of [12, 14, 18]) {
  ctx.font = `${size}px SondeDS`;
  out.canvas[size] = {}; out.svg[size] = {};
  for (const s of strings) {
    out.canvas[size][s] = +ctx.measureText(s).width.toFixed(3);
    t.setAttribute('font-family', 'SondeDS'); t.setAttribute('font-size', String(size));
    t.textContent = s;
    out.svg[size][s] = +t.getComputedTextLength().toFixed(3);
  }
}
window.__out = { moteur: 'chromium', mesures: out }; window.__done = true;
</script></body></html>
