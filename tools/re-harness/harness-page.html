<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RE harness page</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage" width="256" height="192"></canvas>
<script type="module">
  // In-page deterministic engine: the same pure logic as src/engines.mjs,
  // duplicated here because the page cannot import Node modules. Any change
  // must be mirrored in src/engines.mjs (the Node selftest compares both).
  function clone(v) { return JSON.parse(JSON.stringify(v)); }
  function geometryOf(elements, connections) {
    const bounds = {}; const waypoints = {};
    for (const [id, el] of elements) bounds[id] = { x: el.x ?? 0, y: el.y ?? 0, width: el.width ?? 0, height: el.height ?? 0 };
    for (const c of connections) if (Array.isArray(c.waypoints)) waypoints[c.id] = clone(c.waypoints);
    const all = Object.values(bounds);
    let viewbox = null;
    if (all.length) {
      const minX = Math.min(...all.map((b) => b.x)); const minY = Math.min(...all.map((b) => b.y));
      const maxX = Math.max(...all.map((b) => b.x + b.width)); const maxY = Math.max(...all.map((b) => b.y + b.height));
      viewbox = { x: minX, y: minY, width: maxX - minX, height: maxY - minY };
    }
    return { bounds, waypoints, viewbox };
  }
  window.__reHarnessRun = (fixture, ops) => {
    const model = clone(fixture.model || {});
    const elements = new Map(); const order = []; const connections = [];
    if (Array.isArray(model.elements)) for (const el of model.elements) { elements.set(el.id, clone(el)); order.push(el.id); }
    if (Array.isArray(model.nodes)) for (const n of model.nodes) { elements.set(n.id, { id: n.id, type: n.type || "node", x: n.position?.x ?? n.x ?? 0, y: n.position?.y ?? n.y ?? 0, width: n.width ?? 100, height: n.height ?? 40, label: n.data?.label || "" }); order.push(n.id); }
    if (Array.isArray(model.cells)) for (const c of model.cells) { elements.set(c.id, { id: c.id, type: c.type || "element", x: c.position?.x ?? 0, y: c.position?.y ?? 0, width: c.size?.width ?? 100, height: c.size?.height ?? 40, label: "" }); order.push(c.id); }
    for (const src of [model.flows, model.edges]) if (Array.isArray(src)) for (const f of src) connections.push(clone(f));
    const events = []; const undoStack = []; const redoStack = [];
    const emit = (name, payload) => events.push({ name, payload });
    const apply = (inv) => {
      if (!inv) return;
      if (inv.kind === "restore") { elements.set(inv.el.id, clone(inv.el)); if (!order.includes(inv.el.id)) order.push(inv.el.id); }
      else if (inv.kind === "remove") { elements.delete(inv.id); const i = order.indexOf(inv.id); if (i >= 0) order.splice(i, 1); }
      else if (inv.kind === "patch") { const el = elements.get(inv.id); if (el) Object.assign(el, clone(inv.fields)); }
      else if (inv.kind === "connections") { connections.length = 0; for (const c of clone(inv.connections)) connections.push(c); }
    };
    for (const step of (ops && ops.steps) || []) {
      if (step.op === "undo") { const e = undoStack.pop(); if (e) { redoStack.push(e); apply(e.inverse); emit("commandStack.undone", { command: e.name }); } continue; }
      if (step.op === "redo") { const e = redoStack.pop(); if (e) { undoStack.push(e); apply(e.forward); emit("commandStack.redone", { command: e.name }); } continue; }
      redoStack.length = 0;
      if (step.op === "create") {
        const el = { id: step.elementId, type: step.type || "task", x: step.x ?? 0, y: step.y ?? 0, width: step.width ?? 100, height: step.height ?? 80, label: step.label || "" };
        elements.set(el.id, el); order.push(el.id);
        undoStack.push({ name: "create", inverse: { kind: "remove", id: el.id }, forward: { kind: "restore", el: clone(el) } });
        emit("shape.create", { elementId: el.id, type: el.type }); emit("element.changed", { elementId: el.id });
      } else if (step.op === "move" || step.op === "resize") {
        const el = elements.get(step.elementId); if (!el) continue;
        const before = { x: el.x, y: el.y, width: el.width, height: el.height };
        if (step.op === "move") { el.x = step.x ?? el.x; el.y = step.y ?? el.y; } else { el.width = step.width ?? el.width; el.height = step.height ?? el.height; }
        undoStack.push({ name: step.op, inverse: { kind: "patch", id: el.id, fields: before }, forward: { kind: "patch", id: el.id, fields: { x: el.x, y: el.y, width: el.width, height: el.height } } });
        emit(step.op === "move" ? "shape.move" : "shape.resize", { elementId: el.id }); emit("element.changed", { elementId: el.id });
      } else if (step.op === "connect") {
        const before = clone(connections);
        const conn = { id: step.elementId || "flow_" + (connections.length + 1), source: step.sourceId, target: step.targetId, waypoints: step.waypoints || [] };
        connections.push(conn);
        undoStack.push({ name: "connect", inverse: { kind: "connections", connections: before }, forward: { kind: "connections", connections: clone(connections) } });
        emit("connection.create", { elementId: conn.id, sourceId: conn.source, targetId: conn.target });
      } else if (step.op === "setLabel" || step.op === "setType") {
        const el = elements.get(step.elementId); if (!el) continue;
        const field = step.op === "setLabel" ? "label" : "type";
        const before = { [field]: el[field] };
        el[field] = field === "label" ? (step.label || "") : (step.type || el.type);
        undoStack.push({ name: step.op, inverse: { kind: "patch", id: el.id, fields: before }, forward: { kind: "patch", id: el.id, fields: { [field]: el[field] } } });
        emit("element.updateLabel", { elementId: el.id });
      }
    }
    const outModel = clone(fixture.model || {});
    outModel.elements = order.map((id) => elements.get(id)).filter(Boolean);
    outModel.flows = clone(connections);
    const geometry = geometryOf(elements, connections);
    // Backing-store pixels via Canvas2D (golden harness pattern: read the
    // canvas backing store directly, fonts pinned, document.fonts.ready).
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const vb = geometry.viewbox || { x: 0, y: 0, width: 1, height: 1 };
    const sx = canvas.width / Math.max(1, vb.width); const sy = canvas.height / Math.max(1, vb.height);
    ctx.fillStyle = "#1e5ac8";
    for (const b of Object.values(geometry.bounds)) ctx.fillRect((b.x - vb.x) * sx, (b.y - vb.y) * sy, Math.max(1, b.width * sx), Math.max(1, b.height * sy));
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    return { model: outModel, events, geometry, pixels: { width: canvas.width, height: canvas.height, data: Array.from(img.data) } };
  };
  window.__harnessReady = (async () => { try { await document.fonts.ready; } catch (e) {} return true; })();
</script>
</body>
</html>
