name: Svelte Publish

# Publication du package Svelte (@sentropic/design-system-svelte), sur sa propre
# ligne de version, indépendante des packages DS coeur (tokens/themes) et des thèmes.
# Déclenchée par un tag `svelte-v<version>`.
#
# Publication via npm Trusted Publishing (OIDC). Le trusted publisher attendu
# côté npm est : rhanka/sent-tech-design-system + svelte-publish.yml.
# (Évite le lockstep du workflow npm-publish.yml qui publie tokens+themes+svelte
#  ensemble sur tag v* — tokens/themes restent figés et bloquent ce job.)

on:
  push:
    tags: ["svelte-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Build the full local @sentropic dependency closure of
      # packages/components-svelte, in topological order. npm ci symlinks the
      # workspace deps of components-svelte (rich-text, themes, graph,
      # theme-dsfr, tokens) into node_modules, and their exports point at
      # dist/ — svelte-check / svelte-package fail with "Cannot find module
      # '@sentropic/design-system-rich-text'" when any of them is unbuilt
      # (that is exactly how the svelte-v0.37.0 verify run failed: this step
      # built tokens/graph/themes/theme-dsfr but never rich-text).
      # @sentropic/diagram-canvas is seeded too because tsconfig.parity.json
      # reaches ../diagram-canvas/src, whose sources import
      # @sentropic/diagram-core by name (another root workspace symlink whose
      # exports point at dist/). ensure-theme-dists derives each closure from
      # the workspace graph, so a new local dependency needs no edit here;
      # scripts/verify-svelte-publish-deps.test.mjs fails if a closure member
      # is no longer built before this package.
      - name: Build Svelte dependencies
        run: node scripts/ensure-theme-dists.mjs --workspaces=@sentropic/design-system-svelte,@sentropic/diagram-canvas
      - name: Verify Svelte package
        run: |
          npm --workspace @sentropic/design-system-svelte run build
          npm --workspace @sentropic/design-system-svelte run check
          npm --workspace @sentropic/design-system-svelte run test
      - name: Build workspace for package smoke
        run: npm run build
      - name: Smoke packed packages
        run: npm run pack:smoke

  release-guard:
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/svelte-v')
    env:
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag is merged into default branch
        run: |
          git fetch origin "${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${RELEASE_BRANCH}"; then
            echo "::error::Refusing to publish ${TAG}: ${GITHUB_SHA} is not merged into origin/${RELEASE_BRANCH}."
            exit 1
          fi
      - name: Verify Svelte version matches tag
        run: |
          EXPECTED="${TAG#svelte-v}"
          ACTUAL=$(node -p "require('./packages/components-svelte/package.json').version")
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Tag ${TAG} expects ${EXPECTED} but packages/components-svelte is ${ACTUAL}."
            exit 1
          fi
          echo "Svelte package version matches ${EXPECTED}"

  publish:
    needs: release-guard
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/svelte-v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm
        run: npm install -g npm@11.6.2
      - name: Install and build
        run: |
          npm ci
          # Same dependency closure as the verify job (including the
          # diagram-canvas seed the parity tsconfig needs), built in
          # topological order. --no-hash leaves no dist/.srchash marker: npm
          # pack includes dotfiles inside `files` directories, so the marker
          # would otherwise ship inside the published tarball.
          node scripts/ensure-theme-dists.mjs --no-hash --workspaces=@sentropic/design-system-svelte,@sentropic/diagram-canvas
      # Fail closed (lot DC-1, review item 7): every exact @sentropic/* version
      # the svelte manifest pins (themes 0.12.0, rich-text 0.1.0, graph 0.3.0,
      # theme-dsfr 0.2.2, diagram-canvas 0.1.0) must already exist on the npm
      # registry before this package ships — a local-tarball smoke cannot catch
      # an unresolvable pin. Release order (docs/release.md): diagram-core →
      # diagram-canvas (tag `diagram-canvas-v<version>`,
      # diagram-canvas-publish.yml) → tokens/themes if changed → svelte.
      - name: Verify pinned @sentropic dependencies are on npm (fail closed)
        run: node scripts/verify-deps-published.mjs --workspace packages/components-svelte
      - name: Publish Svelte package
        run: npm publish --workspace @sentropic/design-system-svelte --access public

  post-publish-check:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/svelte-v')
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Wait for npm propagation
        run: |
          VERSION="${TAG#svelte-v}"
          for attempt in {1..20}; do
            if npm view "@sentropic/design-system-svelte@${VERSION}" version --silent > /dev/null 2>&1; then
              echo "@sentropic/design-system-svelte@${VERSION} is available from npm."
              exit 0
            fi
            echo "Waiting for npm propagation, attempt ${attempt}/20..."
            sleep 15
          done
          echo "::error::Timed out waiting for npm propagation."
          exit 1
