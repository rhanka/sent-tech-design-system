name: Dataviz Publish

# Publication des cinq paquets @sentropic/dataviz-* en lockstep, sur leur
# propre ligne de version, indépendante de @sentropic/graph et des paquets DS
# existants. Déclenchée par un tag `dataviz-v<version>`.
#
# Ordre de publication : dataviz-core d'abord, puis svelte, react, vue,
# angular (les adaptateurs dépendent du cœur à la version exacte du tag).
#
# Publication via npm Trusted Publishing (OIDC). Le trusted publisher attendu
# côté npm est : rhanka/sent-tech-design-system + dataviz-publish.yml.
# @sentropic/dataviz-angular n'a jamais été publié : sa première publication
# passe par le chemin d'amorçage au jeton temporaire (secret NPM_TOKEN,
# voir docs/release.md), inactif quand le secret est absent.

on:
  push:
    tags: ["dataviz-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Build the full local @sentropic dependency closure of the five dataviz
      # packages, in topological order. The closure covers dataviz-core, the
      # four component packages (dataviz-svelte pulls in design-system-svelte,
      # which needs rich-text, graph, theme-dsfr, themes, tokens) — the old
      # hand-written list missed rich-text/graph/theme-dsfr and broke
      # svelte-check inside design-system-svelte. ensure-theme-dists derives
      # the closure from the workspace graph, so a new local dependency needs
      # no edit here.
      - name: Build Dataviz dependencies
        run: node scripts/ensure-theme-dists.mjs --workspaces=@sentropic/dataviz-core,@sentropic/dataviz-svelte,@sentropic/dataviz-react,@sentropic/dataviz-vue,@sentropic/dataviz-angular
      - name: Verify Dataviz packages
        run: |
          npm --workspace @sentropic/dataviz-core run build
          npm --workspace @sentropic/dataviz-core run check
          npm --workspace @sentropic/dataviz-core run test
          npm --workspace @sentropic/dataviz-svelte run build
          npm --workspace @sentropic/dataviz-svelte run check
          npm --workspace @sentropic/dataviz-svelte run test
          npm --workspace @sentropic/dataviz-react run build
          npm --workspace @sentropic/dataviz-react run check
          npm --workspace @sentropic/dataviz-react run test
          npm --workspace @sentropic/dataviz-vue run build
          npm --workspace @sentropic/dataviz-vue run check
          npm --workspace @sentropic/dataviz-vue run test
          npm --workspace @sentropic/dataviz-angular run build
          npm --workspace @sentropic/dataviz-angular run check
          npm --workspace @sentropic/dataviz-angular run test
      - name: Build workspace for package smoke
        run: npm run build
      - name: Smoke packed packages
        run: npm run pack:smoke

  release-guard:
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/dataviz-v')
    env:
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag is merged into default branch
        run: |
          git fetch origin "${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${RELEASE_BRANCH}"; then
            echo "::error::Refusing to publish ${TAG}: ${GITHUB_SHA} is not merged into origin/${RELEASE_BRANCH}."
            exit 1
          fi
      - name: Verify Dataviz versions match tag
        run: |
          EXPECTED="${TAG#dataviz-v}"
          EXPECTED="$EXPECTED" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const expected = process.env.EXPECTED;
          // The five dataviz packages move in lockstep: every manifest and
          // every internal dependency must carry the tag version.
          const manifests = [
            "packages/dataviz-core/package.json",
            "packages/dataviz-svelte/package.json",
            "packages/dataviz-react/package.json",
            "packages/dataviz-vue/package.json",
            "packages/dataviz-angular/package.json",
          ];
          const failures = [];

          for (const manifestPath of manifests) {
            const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
            if (manifest.version !== expected) {
              failures.push(`${manifest.name}: ${manifest.version}`);
            }
            for (const field of ["dependencies", "peerDependencies", "optionalDependencies"]) {
              for (const [name, version] of Object.entries(manifest[field] ?? {})) {
                if (name.startsWith("@sentropic/dataviz-") && version !== expected) {
                  failures.push(`${manifest.name} -> ${name}: ${version}`);
                }
              }
            }
          }

          if (failures.length > 0) {
            console.error(`Tag version ${expected} does not match dataviz versions:`);
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }

          console.log(`All dataviz package versions match ${expected}`);
          NODE

  publish:
    needs: release-guard
    outputs:
      dist-tag: ${{ steps.publish.outputs.dist-tag }}
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/dataviz-v')
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm
        run: npm install -g npm@11.6.2
      - name: Install and build
        run: |
          npm ci
          # Same dependency closure as the verify job, in topological order.
          # --no-hash leaves no dist/.srchash marker: npm pack includes
          # dotfiles inside `files` directories, so the marker would otherwise
          # ship inside the published tarballs.
          node scripts/ensure-theme-dists.mjs --no-hash --workspaces=@sentropic/dataviz-core,@sentropic/dataviz-svelte,@sentropic/dataviz-react,@sentropic/dataviz-vue,@sentropic/dataviz-angular
      - name: Dist import closure (packed package with registry dependencies)
        run: npm run dist:import-closure -- --workspaces=@sentropic/dataviz-core,@sentropic/dataviz-svelte,@sentropic/dataviz-react,@sentropic/dataviz-vue,@sentropic/dataviz-angular
      - name: Bootstrap npm auth for first publish (inactive without secret)
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
      - name: Verify core runtime dependencies and peers exist on npm
        run: node scripts/verify-deps-published.mjs --workspace packages/dataviz-core --runtime
      - name: Publish Dataviz packages in dependency order
        id: publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A version already on npm (first publication done by hand under the
          # owner's browser 2FA, because npm cannot attach a trusted publisher to
          # a package that does not exist yet) is skipped, never republished.
          VERSION="${TAG#dataviz-v}"
          VERSION_CORE="${VERSION%%+*}"
          DIST_TAG=latest
          if [[ "$VERSION_CORE" == *-* ]]; then
            PRERELEASE="${VERSION_CORE#*-}"
            DIST_TAG="${PRERELEASE%%.*}"
            if [ "$DIST_TAG" = latest ]; then
              echo "::error::Refusing to publish a prerelease under latest."
              exit 1
            fi
          fi
          for package in @sentropic/dataviz-core @sentropic/dataviz-svelte @sentropic/dataviz-react @sentropic/dataviz-vue @sentropic/dataviz-angular; do
            # Core must be available before an adapter can pass this guard.
            # Each adapter checks every dependency and peer, including optional ones.
            node scripts/verify-deps-published.mjs --workspace "packages/${package#@sentropic/}" --runtime
            if npm view "${package}@${VERSION}" version --silent > /dev/null 2>&1; then
              echo "${package}@${VERSION} is already on npm: skipped."
            else
              npm publish --workspace "${package}" --access public --tag "$DIST_TAG"
            fi
          done
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

  post-publish-check:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/dataviz-v')
    env:
      TAG: ${{ github.ref_name }}
      DIST_TAG: ${{ needs.publish.outputs.dist-tag }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Wait for npm propagation
        run: |
          VERSION="${TAG#dataviz-v}"
          PACKAGES=(
            "@sentropic/dataviz-core"
            "@sentropic/dataviz-svelte"
            "@sentropic/dataviz-react"
            "@sentropic/dataviz-vue"
            "@sentropic/dataviz-angular"
          )

          for attempt in {1..20}; do
            missing=()

            for package in "${PACKAGES[@]}"; do
              if [ "$(npm view "${package}@${DIST_TAG}" version --silent 2>/dev/null)" != "$VERSION" ]; then
                missing+=("${package}@${DIST_TAG} -> ${VERSION}")
              fi
            done

            if [ "${#missing[@]}" -eq 0 ]; then
              echo "All packages are available from npm."
              exit 0
            fi

            echo "Waiting for npm propagation, attempt ${attempt}/20: ${missing[*]}"
            sleep 15
          done

          echo "::error::Timed out waiting for npm propagation."
          exit 1

      - name: Install published packages
        run: |
          VERSION="${TAG#dataviz-v}"
          mkdir /tmp/sent-tech-dataviz-post-publish
          cd /tmp/sent-tech-dataviz-post-publish
          npm init -y --silent
          npm install \
            "@sentropic/dataviz-core@${VERSION}" \
            "@sentropic/dataviz-svelte@${VERSION}" \
            "@sentropic/dataviz-react@${VERSION}" \
            "@sentropic/dataviz-vue@${VERSION}" \
            "@sentropic/dataviz-angular@${VERSION}" \
            "svelte@^5" \
            "react@^19" \
            "react-dom@^19" \
            "vue@^3" \
            "@angular/core@^21.2.17" \
            "@angular/compiler@^21.2.17"

      - name: Verify published package imports
        run: |
          cd /tmp/sent-tech-dataviz-post-publish
          node --input-type=module <<'NODE'
          const core = await import("@sentropic/dataviz-core");
          if (typeof core.validateModel !== "function") {
            throw new Error("@sentropic/dataviz-core missing validateModel export");
          }

          const react = await import("@sentropic/dataviz-react");
          if (Object.keys(react).length === 0) {
            throw new Error("@sentropic/dataviz-react has no exports");
          }

          const vue = await import("@sentropic/dataviz-vue");
          if (Object.keys(vue).length === 0) {
            throw new Error("@sentropic/dataviz-vue has no exports");
          }

          await import("@angular/compiler");
          const angular = await import("@sentropic/dataviz-angular");
          if (Object.keys(angular).length === 0) {
            throw new Error("@sentropic/dataviz-angular has no exports");
          }

          const svelteEntry = await import.meta.resolve("@sentropic/dataviz-svelte");
          if (!svelteEntry.endsWith("dist/index.js")) {
            throw new Error("@sentropic/dataviz-svelte resolves to an unexpected entry: " + svelteEntry);
          }
          NODE
