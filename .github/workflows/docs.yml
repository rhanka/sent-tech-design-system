name: Docs

on:
  push:
    branches: ["main"]
    # The built site embeds 135 in-house packages: the four framework component
    # libraries (its tabbed examples render Svelte, React, Vue AND Angular), the
    # token and theme layers, the skills CLI, and every theme package. Listing a
    # subset froze production: a fix to packages/components-angular — including
    # the buildSmoothPath stub that drew straight lines for every smoothed chart
    # since June — did not redeploy, and neither would a fix to an existing theme.
    # The theme lot only deployed because it happened to touch apps/docs.
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "scripts/ensure-theme-dists.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      # node_modules cache, workspaces included: the lockfile nests some
      # devDependencies (for instance
      # packages/dataviz-react/node_modules/@vitejs/plugin-react), and a
      # root-only cache made the install step skip on a hit with those nested
      # modules absent. The key stays the lockfile hash, so the restored tree
      # always matches the lock.
      - name: Restore node_modules
        id: root-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: node-modules-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.root-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Restore previously-built theme/component dists. ensure-theme-dists (run
      # by the docs prebuild) rebuilds only packages whose source hash changed,
      # so on a docs-only change every theme is skipped and only the docs vite
      # build runs. Content-hash skip stays correct across cache restores.
      - name: Restore built dists
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/dist
          key: dist-v1-${{ hashFiles('packages/*/src/**', 'packages/*/package.json', 'packages/*/*.config.*', 'packages/*/tsconfig*.json') }}
          restore-keys: |
            dist-v1-

      # Builds the docs; its prebuild (scripts/ensure-theme-dists.mjs) rebuilds
      # only the packages whose sources changed since their dist was built.
      - name: Build docs (incremental package rebuild)
        run: npm run build --workspace=@sentropic/design-system-docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
