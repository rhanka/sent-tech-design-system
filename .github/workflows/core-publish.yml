name: Core Publish

# Publication des paquets DS coeur uniquement
# (@sentropic/design-system-tokens puis @sentropic/design-system-themes),
# sur leur propre ligne de version, indépendante de design-system-svelte.
# Déclenchée par un tag `core-v<version>`.
#
# Pourquoi un workflow dédié : npm-publish.yml publie tokens+themes+svelte en
# lockstep sur un tag `v<version>` qui exige que les trois versions soient
# identiques, ce qui est impossible tant que svelte vit sur sa propre ligne
# (0.37.x). Les consommateurs (svelte, thèmes clients) épinglent des versions
# exactes de tokens/themes, donc le coeur doit pouvoir être publié seul, en
# amont — docs/release.md décrit l'ordre exact des tags.
#
# Publication via npm Trusted Publishing (OIDC) : trusted publisher
# (rhanka/sent-tech-design-system + core-publish.yml, permission npm publish)
# configuré sur npm pour les deux paquets — aucun token requis.

on:
  push:
    tags: ["core-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build and test core packages (dep order)
        run: |
          npm --workspace @sentropic/design-system-tokens run build
          npm --workspace @sentropic/design-system-tokens run test
          npm --workspace @sentropic/design-system-themes run build
          npm --workspace @sentropic/design-system-themes run test
      - name: Verify publishable licensing
        run: npm run licensing:check
      - name: Build workspace for package smoke
        run: npm run build
      - name: Smoke packed packages
        run: npm run pack:smoke

  release-guard:
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/core-v')
    env:
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Verify tag is merged into default branch
        run: |
          git fetch origin "${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${RELEASE_BRANCH}"; then
            echo "::error::Refusing to publish ${TAG}: ${GITHUB_SHA} is not merged into origin/${RELEASE_BRANCH}."
            exit 1
          fi
      - name: Verify core package versions match tag
        run: |
          EXPECTED="${TAG#core-v}"
          TOKENS=$(node -p "require('./packages/tokens/package.json').version")
          THEMES=$(node -p "require('./packages/themes/package.json').version")
          if [ "$EXPECTED" != "$TOKENS" ] || [ "$EXPECTED" != "$THEMES" ]; then
            echo "::error::Tag ${TAG} expects ${EXPECTED} but tokens is ${TOKENS} and themes is ${THEMES}."
            exit 1
          fi
          echo "Core package versions match ${EXPECTED}"

  publish:
    needs: release-guard
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/core-v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm
        run: npm install -g npm@11.6.2
      - name: Install and build
        run: |
          npm ci
          npm --workspace @sentropic/design-system-tokens run build
          npm --workspace @sentropic/design-system-themes run build
      - name: Publish tokens
        run: npm publish --workspace @sentropic/design-system-tokens --access public
      - name: Publish themes
        run: npm publish --workspace @sentropic/design-system-themes --access public

  post-publish-check:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/core-v')
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Wait for npm propagation
        run: |
          VERSION="${TAG#core-v}"
          ok=""
          for attempt in {1..20}; do
            if npm view "@sentropic/design-system-tokens@${VERSION}" version --silent > /dev/null 2>&1 \
              && npm view "@sentropic/design-system-themes@${VERSION}" version --silent > /dev/null 2>&1; then
              echo "tokens@${VERSION} and themes@${VERSION} are available from npm."
              ok=1; break
            fi
            echo "Waiting for core propagation, attempt ${attempt}/20..."
            sleep 15
          done
          if [ -z "$ok" ]; then echo "::error::Timed out waiting for core packages."; exit 1; fi
