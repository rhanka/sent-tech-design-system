name: Vue Publish

# Publication du port Vue (@sentropic/design-system-vue), sur sa propre ligne
# de version, indépendante des packages DS coeur, du port React et des thèmes.
# Déclenchée par un tag `vue-v<version>`.
#
# Publication via npm Trusted Publishing (OIDC). Le trusted publisher attendu
# côté npm est : rhanka/sent-tech-design-system + vue-publish.yml.
# (À configurer sur npmjs.com pour @sentropic/design-system-vue avant le 1er tag.)

on:
  push:
    tags: ["vue-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build Vue dependencies
        run: |
          npm --workspace @sentropic/design-system-tokens run build
          npm --workspace @sentropic/design-system-themes run build
      - name: Verify Vue package
        run: |
          npm --workspace @sentropic/design-system-vue run build
          npm --workspace @sentropic/design-system-vue run check
          npm --workspace @sentropic/design-system-vue run test
      - name: Build workspace for package smoke
        run: npm run build
      - name: Smoke packed packages
        run: npm run pack:smoke

  release-guard:
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/vue-v')
    env:
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag is merged into default branch
        run: |
          git fetch origin "${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${RELEASE_BRANCH}"; then
            echo "::error::Refusing to publish ${TAG}: ${GITHUB_SHA} is not merged into origin/${RELEASE_BRANCH}."
            exit 1
          fi
      - name: Verify Vue version matches tag
        run: |
          EXPECTED="${TAG#vue-v}"
          ACTUAL=$(node -p "require('./packages/components-vue/package.json').version")
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Tag ${TAG} expects ${EXPECTED} but packages/components-vue is ${ACTUAL}."
            exit 1
          fi
          echo "Vue package version matches ${EXPECTED}"

  publish:
    needs: release-guard
    outputs:
      dist-tag: ${{ steps.publish.outputs.dist-tag }}
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/vue-v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm
        run: npm install -g npm@11.6.2
      - name: Install and build
        run: |
          npm ci
          npm --workspace @sentropic/design-system-tokens run build
          npm --workspace @sentropic/design-system-themes run build
          npm --workspace @sentropic/design-system-vue run build
      - name: Publish Vue package
        id: publish
        run: |
          VERSION=$(node -p "require('./packages/components-vue/package.json').version")
          VERSION_CORE="${VERSION%%+*}"
          DIST_TAG=latest
          if [[ "$VERSION_CORE" == *-* ]]; then
            PRERELEASE="${VERSION_CORE#*-}"
            DIST_TAG="${PRERELEASE%%.*}"
            if [ "$DIST_TAG" = latest ]; then
              echo "::error::Refusing to publish a prerelease under latest."
              exit 1
            fi
          fi
          npm publish --workspace @sentropic/design-system-vue --access public --tag "$DIST_TAG"
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

  post-publish-check:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/vue-v')
    env:
      TAG: ${{ github.ref_name }}
      DIST_TAG: ${{ needs.publish.outputs.dist-tag }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Wait for npm propagation
        run: |
          VERSION="${TAG#vue-v}"
          for attempt in {1..20}; do
            if [ "$(npm view "@sentropic/design-system-vue@${DIST_TAG}" version --silent 2>/dev/null)" = "$VERSION" ]; then
              echo "@sentropic/design-system-vue@${DIST_TAG} resolves to ${VERSION} on npm."
              exit 0
            fi
            echo "Waiting for npm propagation, attempt ${attempt}/20..."
            sleep 15
          done
          echo "::error::Timed out waiting for npm propagation."
          exit 1
