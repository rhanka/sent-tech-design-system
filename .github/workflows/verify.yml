name: Verify

# Scalable package gate:
# - detects changed package workspaces from the git diff
# - expands to local dependents (tokens -> themes/frameworks/themes depending on them)
# - shards affected workspaces across ~10 jobs
# - runs check/test/pack-smoke in parallel per shard
# - full scan only for package-lock/root package/scripts/workflow changes

on:
  push:
    branches: ["main"]
    paths:
      - "packages/**"
      - "apps/docs/**"
      - "scripts/**"
      - "tools/**"
      - "docs/graph-dataviz-*"
      - "package.json"
      - "package-lock.json"
      # Every file a repository guard reads must be able to trigger this workflow,
      # or a change to it lands with no guard running. Enforced by
      # scripts/verify-workflow-invariants.test.mjs ("every file a guard reads …").
      - ".github/workflows/**"
      - ".ds-scrap/METHOD-fr-top50.md"
  pull_request:
    paths:
      - "packages/**"
      - "apps/docs/**"
      - "scripts/**"
      - "tools/**"
      - "docs/graph-dataviz-*"
      - "package.json"
      - "package-lock.json"
      # Every file a repository guard reads must be able to trigger this workflow,
      # or a change to it lands with no guard running. Enforced by
      # scripts/verify-workflow-invariants.test.mjs ("every file a guard reads …").
      - ".github/workflows/**"
      - ".ds-scrap/METHOD-fr-top50.md"
  workflow_dispatch:

jobs:
  # Deliberately NOT sharded and NOT gated on the affected-workspace plan: the
  # package this catches is the one nobody thought to select. It needs no build
  # (it reads manifests, the lockfile and `npm pack --dry-run`), so it is the
  # cheapest job here and it always runs.
  licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # The repository-level guards — layering, provenance invariants, theme
      # shape and theme invariants, the licensing gate's own defect tests — were
      # held by the root `npm test` only, and no workflow ran them: measured on
      # origin/main, `git show origin/main:.github/workflows/verify.yml` had no
      # `node --test` step, in this workflow or in any other. Root `npm test` is
      # `node --test scripts/*.test.mjs && node scripts/run-workspaces.mjs test`,
      # whose second half needs a working Chrome for the packages/graph golden
      # tests, so nobody could use it as a gate. A guard nothing runs is a guard
      # nobody has checked — a test with a false name survived weeks in
      # scripts/verify-layering.test.mjs that way.
      #
      # It runs here, in the unsharded job, for the same reason the provenance
      # ledger does: these guards read the whole tree, not a workspace slice, and
      # the defect they catch is in the package nobody thought to select.
      #
      # Via the runner rather than `node --test scripts/*.test.mjs` because that
      # form exits 0 when the glob resolves to nothing; the runner asserts a floor
      # on the number of guard files first. See its header for the measurement.
      - name: Repository guards (scripts/*.test.mjs)
        run: node scripts/run-script-guards.mjs

      - name: Licensing gate (all publishable packages)
        run: npm run licensing:check

      # The repatriated graph/dataviz files carry a provenance ledger: source
      # repository, commit, blob and hash, plus a named status for every
      # adaptation. It was verified by hand until now, so drift was silent —
      # two manifest hashes had already gone stale under dependency bumps by
      # the time this step was added. It runs here rather than in the shards
      # because it reads the whole tree, not a workspace slice.
      - name: Provenance ledger (repatriated graph/dataviz files)
        run: node tools/graph-dataviz-provenance/verify.mjs

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Plan affected workspace shards
        id: plan
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
              BASE="HEAD^"
            fi
          fi
          HEAD="${{ github.sha }}"
          MATRIX=$(node scripts/ci-affected-workspaces.mjs --base="$BASE" --head="$HEAD" --shards=10 --include-apps --format=github-matrix)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

  verify:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '{"include":[]}' }}
    name: verify (${{ matrix.task }} / shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # node_modules cache for the fan-out jobs. It MUST cover the workspace
      # node_modules too: the lockfile nests some devDependencies (for instance
      # packages/dataviz-react/node_modules/@vitejs/plugin-react, required by
      # that workspace's vitest config), and a root-only cache made the install
      # step skip on a hit while those nested modules were absent — the shard
      # then failed with ERR_MODULE_NOT_FOUND on a tree that npm ci resolves
      # correctly. The key stays the lockfile hash, so the restored tree always
      # matches the lock.
      - name: Restore node_modules
        id: root-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: node-modules-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.root-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Restore built dists
        uses: actions/cache@v4
        with:
          path: packages/*/dist
          key: dist-v1-${{ hashFiles('packages/*/src/**', 'packages/*/package.json', 'packages/*/*.config.*', 'packages/*/tsconfig*.json') }}
          restore-keys: |
            dist-v1-

      - name: Build packages (incremental, content-hash)
        run: node scripts/ensure-theme-dists.mjs --workspaces="${{ matrix.workspaces }}"

      - name: check
        if: matrix.task == 'check'
        run: node scripts/run-workspaces.mjs check --workspaces="${{ matrix.workspaces }}"

      - name: test
        if: matrix.task == 'test'
        run: node scripts/run-workspaces.mjs test --workspaces="${{ matrix.workspaces }}"

      - name: pack-smoke
        if: matrix.task == 'pack-smoke'
        run: node scripts/smoke-pack.mjs --workspaces="${{ matrix.workspaces }}"

      # Three tests in scripts/verify-dataviz-docs-lot1.test.mjs read a BUILT
      # docs site. Nothing built one: the unsharded `licensing` job runs the
      # guards after a bare `npm ci`, and the shards above build package dists
      # only. The gate therefore reported `not ok` there on a false precondition
      # — the instrument's gap charged to the pages — and it now reports those
      # three as NOT RUN instead. But a gate that never measures anywhere is the
      # defect the guards step existed to remove, so it has to run where the
      # site CAN be built.
      #
      # Here, in the shard that already selected apps/docs, rather than in a
      # dedicated job: the build cost is paid only when apps/docs is actually
      # affected, and the gate runs exactly when it is relevant. `contains()` on
      # the comma-separated workspace list is unambiguous — `design-system-docs`
      # is the only workspace name holding the substring (measured). Guarded on
      # the `test` task so the build happens once per shard, not again under
      # `check`/`pack-smoke`.
      #
      # `npm run docs:build` runs apps/docs' `prebuild` (ensure-theme-dists),
      # which needs every theme dist because the docs app imports them all; the
      # `Restore built dists` cache above is what keeps that affordable.
      - name: Build the docs site (precondition of the dataviz lot gate)
        if: matrix.task == 'test' && contains(matrix.workspaces, '@sentropic/design-system-docs')
        run: npm run docs:build

      # Runs the whole file, not a subset: the source-level assertions are cheap
      # and re-running them here costs nothing. The four-tab browser case keeps
      # its OWN skip and stays reported as skipped with its reason named — these
      # runners install no Chromium, and "7 pass, 1 skipped (no runnable
      # browser)" is usable where a silent "8 pass" would not be.
      - name: Dataviz docs lot gate (over the built site)
        if: matrix.task == 'test' && contains(matrix.workspaces, '@sentropic/design-system-docs')
        run: node --test scripts/verify-dataviz-docs-lot1.test.mjs
