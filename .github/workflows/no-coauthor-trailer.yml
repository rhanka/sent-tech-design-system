name: Reject AI attribution trailers

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan-commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Scan commit messages and PR metadata
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { readFileSync } = require('node:fs');

          const scissors = /^# -{3,} >8 -{3,}$/;
          const rules = [
            ['co-authored-by', /^\s*co-authored-by\s*:/i],
            ['claude-session', /^\s*claude-session\s*:/i],
            ['generated-by-ai', /^\s*generated-by\s*:.*\b(?:claude|anthropic|codex|openai|gemini|antigravity|agy|mistral|vibe|muse|copilot|cursor|ai)\b/i],
            ['generated-with-ai', /generated\s+(?:with|by)\s+\[?(?:claude|anthropic|codex|openai|gemini|antigravity|agy|mistral|vibe|muse|copilot|cursor|ai)\b/i],
            ['claude-code-url', /claude\.com\/claude-code/i],
            ['claude-session-url', /claude\.ai\/code\/session_[a-z0-9_-]+/i],
            ['robot-marker', /🤖/u],
          ];

          let failed = false;
          function scan(label, message, { commit = false } = {}) {
            const hits = new Set();
            for (const line of message.split(/\r?\n/)) {
              if (commit && scissors.test(line)) break;
              if (commit && line.startsWith('#')) continue;
              const rule = rules.find(([, pattern]) => pattern.test(line));
              if (rule) hits.add(rule[0]);
            }
            if (hits.size === 0) return;

            failed = true;
            console.error(`::error::${label} contains forbidden AI attribution (${[...hits].join(', ')})`);
          }

          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pr = event.pull_request;
          const base = pr ? pr.base.sha : event.before;
          const head = pr ? pr.head.sha : event.after;
          const revArgs = !pr && /^0+$/.test(base) ? ['-n', '50', head] : [`${base}..${head}`];
          const fields = execFileSync('git', ['log', '-z', '--format=%H%x00%B', ...revArgs, '--'], {
            encoding: 'utf8',
            maxBuffer: 64 * 1024 * 1024,
          }).split('\0');
          fields.pop();

          for (let i = 0; i < fields.length; i += 2) {
            scan(`Commit ${fields[i]}`, fields[i + 1], { commit: true });
          }
          if (pr) {
            scan('PR title', pr.title);
            scan('PR body', pr.body ?? '');
          }

          if (failed) process.exitCode = 1;
          else console.log(`Scanned ${fields.length / 2} commit(s) for forbidden AI attribution.`);
          NODE
