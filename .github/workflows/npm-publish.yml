name: NPM Publish

# Publie les paquets DS via npm Trusted Publishing (OIDC) — c'est le
# trusted publisher déclaré côté npm pour tokens, themes et svelte
# (docs/release.md, §One-Time Npm Setup) :
# - tag `v<version>` : lockstep, tokens + themes + svelte partagent la version ;
# - tag `core-v<version>` : uniquement les paquets coeur (tokens puis themes)
#   sur leur propre ligne de version, indépendante de design-system-svelte.

on:
  push:
    tags: ["v[0-9]*", "core-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify workspace
        run: npm run verify

      - name: Smoke packed packages
        run: npm run pack:smoke

  release-guard:
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/core-v')
    env:
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
      TAG_VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag is merged into default branch
        run: |
          git fetch origin "${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${RELEASE_BRANCH}"; then
            echo "::error::Refusing to publish ${GITHUB_REF_NAME}: ${GITHUB_SHA} is not merged into origin/${RELEASE_BRANCH}."
            exit 1
          fi

      - name: Verify package versions match tag
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const tag = process.env.TAG_VERSION;
          // `v<version>` publishes tokens+themes+svelte in lockstep;
          // `core-v<version>` publishes only the core pair, at their own
          // version, without requiring design-system-svelte to share it.
          const core = tag.startsWith("core-v");
          const expected = core ? tag.slice("core-v".length) : tag.slice(1);
          // Publishable design-system packages only. The design-audit engine
          // (packages/skills) is intentionally excluded from npm releases;
          // it will be productized under an on-brand name after WP8.
          const publishable = core
            ? [
                "packages/tokens/package.json",
                "packages/themes/package.json",
              ]
            : [
                "packages/tokens/package.json",
                "packages/themes/package.json",
                "packages/components-svelte/package.json",
              ];
          const failures = [];

          for (const manifestPath of publishable) {
            const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
            if (manifest.version !== expected) {
              failures.push(`${manifest.name}: ${manifest.version}`);
            }
          }

          if (failures.length > 0) {
            console.error(`Tag ${tag} expects version ${expected} but:`);
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }

          console.log(`Package versions match ${expected} (${core ? "core-v tag: tokens+themes only" : "v lockstep tag"})`);
          NODE

  publish:
    needs: release-guard
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/core-v')
    env:
      # `v<version>` lockstep: svelte shares the tag version. `core-v<version>`:
      # only the core pair publishes, at its own version.
      IS_LOCKSTEP: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@11.6.2
          node --version
          npm --version

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Dist import closure (packed package with registry dependencies)
        run: npm run dist:import-closure -- --workspaces=@sentropic/design-system-tokens,@sentropic/design-system-themes,@sentropic/design-system-svelte
      - name: Publish packages
        run: |
          # Design-system packages only, in dependency order.
          # The design-audit engine (packages/skills) is intentionally NOT
          # published here; it is parked pending a post-WP8 productization and
          # an on-brand rename. Do not add it back without an explicit decision.
          npm publish --workspace @sentropic/design-system-tokens --access public
          npm publish --workspace @sentropic/design-system-themes --access public
          # design-system-svelte shares only the `v<version>` lockstep line;
          # on a `core-v<version>` tag the core pair publishes alone.
          if [ "$IS_LOCKSTEP" = "true" ]; then
            npm publish --workspace @sentropic/design-system-svelte --access public
          fi

  post-publish-check:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/core-v')
    env:
      TAG_VERSION: ${{ github.ref_name }}
      IS_LOCKSTEP: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Wait for npm propagation
        run: |
          VERSION="${TAG_VERSION#v}"
          VERSION="${VERSION#core-v}"
          PACKAGES=(
            "@sentropic/design-system-tokens"
            "@sentropic/design-system-themes"
          )
          if [ "$IS_LOCKSTEP" = "true" ]; then
            PACKAGES+=("@sentropic/design-system-svelte")
          fi

          for attempt in {1..20}; do
            missing=()

            for package in "${PACKAGES[@]}"; do
              if ! npm view "${package}@${VERSION}" version --silent > /dev/null 2>&1; then
                missing+=("${package}@${VERSION}")
              fi
            done

            if [ "${#missing[@]}" -eq 0 ]; then
              echo "All published packages are available from npm."
              exit 0
            fi

            echo "Waiting for npm propagation, attempt ${attempt}/20: ${missing[*]}"
            sleep 15
          done

          echo "::error::Timed out waiting for npm propagation."
          exit 1

      - name: Install published packages
        run: |
          VERSION="${TAG_VERSION#v}"
          VERSION="${VERSION#core-v}"
          mkdir /tmp/sent-tech-post-publish
          cd /tmp/sent-tech-post-publish
          npm init -y --silent
          INSTALL_ARGS=(
            "@sentropic/design-system-tokens@${VERSION}"
            "@sentropic/design-system-themes@${VERSION}"
          )
          if [ "$IS_LOCKSTEP" = "true" ]; then
            INSTALL_ARGS+=(
              "@sentropic/design-system-svelte@${VERSION}"
              "svelte@^5.53.2"
            )
          fi
          npm install "${INSTALL_ARGS[@]}"

      - name: Verify published package imports
        env:
          IS_LOCKSTEP: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cd /tmp/sent-tech-post-publish
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const tokens = await import("@sentropic/design-system-tokens");
          const themes = await import("@sentropic/design-system-themes");

          if (typeof tokens.flattenTokens !== "function") {
            throw new Error("@sentropic/design-system-tokens missing flattenTokens export");
          }

          if (typeof themes.compileTheme !== "function") {
            throw new Error("@sentropic/design-system-themes missing compileTheme export");
          }

          if (process.env.IS_LOCKSTEP === "true") {
            const componentsEntry = await import.meta.resolve("@sentropic/design-system-svelte");
            const componentIndex = readFileSync(new URL(componentsEntry), "utf8");

            for (const exportName of ["Button", "Card", "Input", "Textarea"]) {
              if (!componentIndex.includes("as " + exportName)) {
                throw new Error("@sentropic/design-system-svelte missing " + exportName + " export");
              }
            }
          }

          console.log("Published package imports verified");
          NODE
