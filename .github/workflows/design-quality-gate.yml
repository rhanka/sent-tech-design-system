name: Design Quality Gate

on:
  # Push-to-main docs deploy is optimized for wall-clock time; design quality
  # remains a PR/manual gate instead of adding ~90s to every docs deploy.
  pull_request:
    paths:
      - "apps/docs/**"
      - "docs/**"
      - "packages/skills/**"
      - "packages/components-svelte/**"
      - "packages/themes/**"
      - "packages/tokens/**"
      - ".github/workflows/design-quality-gate.yml"
  workflow_dispatch:

jobs:
  design-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build packages and docs
        run: npm run build

      # csp-no-style-attr runs in report mode (--warn-only): its findings land in
      # the report's `warnings` key, outside the score and the exit code. Blocking,
      # it would take the score from 97 to 82 on today's docs build (1048 literal
      # style attributes). Making it blocking is an owner decision, once the
      # components are fixed.
      - name: Run design quality gate
        run: node packages/skills/dist/cli.js check apps/docs/build --tech --fail-under 95 --warn-only csp-no-style-attr > design-quality-report.json

      # Compatibility proof only: serves the built docs WITH the documented
      # Content-Security-Policy header (script-src 'self', no unsafe-eval or
      # unsafe-inline for scripts) and loads the key pages in Chrome. The policy
      # is NOT applied in production (owner decision, see apps/docs/svelte.config.js).
      - name: CSP compatibility check (docs build)
        run: npm run csp:check --workspace=@sentropic/design-system-docs

      - name: Upload design report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-quality-report
          path: design-quality-report.json
