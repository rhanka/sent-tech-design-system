registries:
  components:
    source: ui_components
    id_column: componentId
    label_column: displayName
    alias_columns:
      - exportName
      - elementName
    node_type: Component
  frameworks:
    source: ui_frameworks
    id_column: id
    label_column: label
    alias_columns:
      - packageName
    node_type: Framework
class_hierarchies:
  ui_artifacts:
    classes:
      UiArtifact:
        label: UI artifact
      Renderable:
        parent: UiArtifact
        label: Renderable catalog item
        member_node_types:
          - Component
          - ViewLayout
          - ComposedView
      Implementation:
        parent: UiArtifact
        label: Framework implementation
        member_node_types:
          - ComponentPort
          - Framework
      ContractSurface:
        parent: UiArtifact
        label: Contract surface
        member_node_types:
          - Contract
          - Prop
          - Slot
          - Event
      Foundation:
        parent: UiArtifact
        label: Design foundation
        member_node_types:
          - TokenSet
          - Token
          - Theme
          - Icon
      Distribution:
        parent: UiArtifact
        label: Distribution
        member_node_types:
          - Package
          - PackageRelease
      Exposure:
        parent: UiArtifact
        label: Agent-facing exposure
        member_node_types:
          - RenderCatalog
          - UiResource
          - McpTool
      Reference:
        parent: UiArtifact
        label: External reference
        member_node_types:
          - DocPage
          - PresentationForm
citation_policy:
  minimum_granularity: file
  require_source_file: true
  allow_bbox: false
hardening:
  statuses:
    - candidate
    - needs_review
    - validated
    - deprecated
    - superseded
    - rejected
    - reference
  default_status: validated
  promotion_requires:
    - evidence_ref
    - ds_review
  status_transitions:
    - from:
        - candidate
      to:
        - validated
        - rejected
      requires:
        - ds_review
    - from:
        - validated
      to:
        - deprecated
        - needs_review
      requires:
        - evidence_ref
    - from:
        - deprecated
      to:
        - superseded
      requires:
        - evidence_ref
    - from:
        - needs_review
      to:
        - validated
        - deprecated
        - rejected
      requires:
        - ds_review
inference_policy:
  allow_inferred_relations: true
  allowed_relation_types:
    - variantOf
    - usesSlotOf
  require_evidence_refs: true
evidence_policy:
  require_evidence_refs: true
  min_refs: 1
  node_types:
    - Component
    - ComponentPort
    - Framework
    - Contract
    - Prop
    - Slot
    - Event
    - TokenSet
    - Token
    - Theme
    - Icon
    - ViewLayout
    - ComposedView
    - Package
    - PackageRelease
    - DocPage
    - RenderCatalog
    - UiResource
    - McpTool
    - PresentationForm
  relation_types:
    - portedTo
    - targetsFramework
    - implementsContract
    - declaresMember
    - importsPort
    - composes
    - usesSlotOf
    - usesToken
    - overridesToken
    - aliasOf
    - inTokenSet
    - extendsTheme
    - usesIcon
    - variantOf
    - replaces
    - partOfPackage
    - releaseOf
    - shippedIn
    - dependsOn
    - documentedIn
    - usesLayout
    - realizedBy
    - listedIn
    - exposedAs
    - supportsCatalog
    - rendersWith
    - callsTool
    - builtFrom
    - rendersForm
    - servesCatalog
outputs:
  ontology:
    enabled: true
    canonical_node_types:
      - Component
      - ComponentPort
      - Framework
      - Contract
      - Prop
      - Slot
      - Event
      - TokenSet
      - Token
      - Theme
      - Icon
      - ViewLayout
      - ComposedView
      - Package
      - PackageRelease
      - DocPage
      - RenderCatalog
      - UiResource
      - McpTool
      - PresentationForm
    source_node_types: []
    occurrence_node_types: []
    alias_fields:
      - aliases
    relation_exports:
      - portedTo
      - targetsFramework
      - implementsContract
      - declaresMember
      - importsPort
      - composes
      - usesSlotOf
      - usesToken
      - overridesToken
      - aliasOf
      - inTokenSet
      - extendsTheme
      - usesIcon
      - variantOf
      - replaces
      - partOfPackage
      - releaseOf
      - shippedIn
      - dependsOn
      - documentedIn
      - usesLayout
      - realizedBy
      - listedIn
      - exposedAs
      - supportsCatalog
      - rendersWith
      - callsTool
      - builtFrom
      - rendersForm
      - servesCatalog
    wiki:
      enabled: true
      page_node_types:
        - Component
        - ViewLayout
