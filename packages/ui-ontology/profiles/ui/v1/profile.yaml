    assertion_basis:
      - index_declaration
    derivation_methods:
      - component_index_delivery
      - barrel_export_resolution
    cardinality:
      source: "1"
      target: 0..n
      status: declared
    presentation:
      encoding: containment
      parent: source
  targetsFramework:
