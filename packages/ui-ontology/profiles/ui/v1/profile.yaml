      include_source_snippets: false
x_ui:
  status: "draft r3; locally validated on engram 0.27.0 sources (profile_hash
    90aa64383475611882a57ca6a739f418dc5a4e7fba2b56df541434b65ef442de; raw sha256,
    hashOntologyProfile(parsed) and bundle digest in STUDY section 10.3, measured from the final
    bytes); not registered in any catalog (owner decision: committed in the DS repo, no engram
    registration before the third-party contract). Revision 3 applies engram r2 findings U1-U4,
    owner r2 decisions (immo pilot, A2UI v1.0 before first projection)."
  profile:
    id: ui
    version: "1"
    canonicalRef: sentropic-ds:ui@1
    renamedFrom: ds-ui@1
    renameJustification: profile identity names the domain (an application's UI graph), not the
      producer; the DS catalog is one producer among producers (owner D2). A producer-scoped id
      (ds-ui) would brand every application's own graph as DS-owned and misstate authority. Same
      node types, relation types and attributes for DS-catalog and application-local instances.
    license: third-party profile, family EXT with family-corpus receipt (engram E2); licence closure
      declared in the catalog record
  format_note: "Engram E1 (format amendment, in progress): cardinality {source,target,status} and
    presentation (node and relation) are declared here in the amendment shapes; the current
    normalizer keeps node presentation inside profile_hash and drops relation
    cardinality/presentation, so the digest is re-pinned once when the amendment lands. Validator
    ignores the extra fields: zero errors regardless. Published only after the amendment."
  cardinality_shape:
    shape: "{ source, target, status }"
    vocabulary:
      - "1"
      - 0..1
      - 1..n
      - 0..n
    vocabulary_source: erd@1 ERD_CARDINALITIES (DS packages/diagram-core/src/profiles/erd.ts)
    reading: "normative, end multiplicity (engram E1): `source` = how many source nodes one target node
      may have; `target` = how many target nodes one source node may have"
    example: 'engram archi2-erd-bridge@1 `storedIn 1..1 -> 0..n` rewrites in this reading as storedIn: {
      source: "0..n", target: "1" } (one entity has exactly one store; a store holds 0..n entities)'
    status: "`declared` | `provisional`; mirrors the erd@1 relationship attribute cardinalityStatus"
  presentation_shape:
    vocabulary: diagram-notation@1
    status: proposed; DC-2d is a draft. Unknown glyphs are warning notation-icon-unknown, never errors
      (DC-2d L63); the glyph inventory freeze is deferred.
    containment:
      shape: '{ encoding: "containment", parent: "source" | "target" }'
      relations:
        portedTo: source
        releaseOf: target
      note: single-parent only; inTokenSet is multi-parent, hence arrow (Carbon B6).
    role_nature:
      rule: card/container = nature component only (DC-2d K2)
      flow_node_document:
        - Contract
        - DocPage
        - RenderCatalog
      entity_table_data:
        - Prop
        - Slot
        - Event
        - TokenSet
        - Token
      note: flow-node types carry no icon and no kicker; entity-table types carry no kicker (DC-2d S3.2
        table)
  producers:
    model: "one profile, many producers. A producer is a repository that runs the index-ui skill and
      emits ui@1 instances. Producers: `ds-catalog` (DS component index and generated sources) and
      `app-<appId>` (any application's UI). Node ids include the producer repo key, so instance sets
      are injective and mergeable."
    producer_attribute: every produced Component, ComposedView, TokenSet, Theme, ViewLayout, Token,
      Package, PackageRelease, Icon, DocPage carries producerId (and appId where relevant);
      producerId is the OWNER of the node, not necessarily the producer that emitted the edge that
      references it
    mirror_rule: a producer mints only its own nodes, except for shared-vocabulary types (see
      shared_vocabulary). DS-catalog components consumed by an app are linked through the bridge
      usesDsComponent, never re-minted; mirrored nodes carry origin ds-catalog-mirror and lose on
      merge
    registry_binding: registries.ui_components / registries.ui_frameworks declare the registry SHAPE;
      each producer binds it to its own source in project configuration (DS build, app build). The
      binding is not part of the profile.
    identity:
      locator:
        tuple: "{ repo, commit, source_file, export_symbol }"
        on:
          - Component
          - ComposedView
          - ViewLayout
        attributes:
          - locatorRepo
          - locatorCommit
          - locatorFile
          - locatorSymbol
        rule: an app-local code element carries the locator on the node itself, at the same grain
          app-context@1 sees (the exported component, view or layout function).
          ComponentPort.path/exportName stay port-level delivery facts and never serve as identity.
          locatorCommit equals the enclosing extraction sourceCommit (manifest.json sourceCommit);
          the bridge compares full locators, so the commit must match too.
        extraction: P1 mints the locator for indexed components; P8 mints it for implemented views and
          layouts from the defining export (file + exported symbol). A taxonomy-only screen (Astra
          4) has no defining export and therefore no locator and no identity edge.
      no_cross_emission: the ui skill never mints app-context@1 nodes (Spec, Route, CodeSymbol, File,
        mcp_server, ...), and the app-context extractor never mints ui@1 nodes. The only meeting
        point is the bridge profile ui-bridge@1 (usesDsComponent, implementsUiElement, servedBy).
      non_code_no_identity: "non-code elements (Token, Theme, Icon, Package, PackageRelease, DocPage,
        RenderCatalog, UiResource, McpTool, PresentationForm, Contract, Prop, Slot, Event,
        Framework) have no identity bridge edge: implementsUiElement targets only Component,
        ComposedView, ViewLayout."
    shared_vocabulary:
      rule: "Mend for engram U4: the id hash already contains repoKey (producer repo), so seeds without
        producerId do not hash-collide across producers; the collision risk is LOGICAL (same seed
        value, two nodes, ambiguous query grain). Each type below states which reading applies.
        Gate: a fragment minting a shared-vocabulary node outside its owning producer is a finding;
        a fragment minting a producer-scoped node with the wrong producerId is a finding."
      Token: "PRODUCER-SCOPED (U4 decision). Seed becomes [producerId, cssCustomPropertyName] (see
        node_id.seeds). Justification: CSS custom property names are short, un-namespaced
        identifiers; application-local tokens exist in the pilot (--rail-fs-*, --signaux-fs-* in
        immo, 9 distinct, beside 36 --st-* references). A single global Token node per css name
        would conflate two producers' definitions. Ownership rule: ds-catalog owns --st-* tokens; an
        app producer owns only its own local custom properties (never a --st-* name: that is a gate
        finding) and references DS tokens through usesToken edges to the ds-catalog-owned Token ids
        (cross-producer edge by exact id). TokenSet membership (inTokenSet) and aliasOf edges never
        cross the ownership boundary except Theme overrides of DS tokens (the DS theme owns the
        override edges)."
      Package: "SHARED VOCABULARY (U4 decision). Seed stays [packageName] (see node_id.seeds).
        Justification: npm package names are global identifiers; the same name in two producers
        denotes the same package, so producerId in the seed would fragment one package into two
        nodes and force a mirror dance for every dependency. Ownership rule: ds-catalog mints the DS
        workspace packages; an app producer mints only packages whose name is absent from the DS set
        (its own packages, e.g. radar-immobilier-ui) and never re-mints a DS package. partOfPackage,
        shippedIn and dependsOn edges target exact owner-minted ids (DS package ids for DS
        dependencies, app ids for app packages)."
      PackageRelease: SHARED VOCABULARY, same rule as Package. Seed stays [packageName, version]. The
        vocabulary owner mints the release node once; consumers link to it. Release identity is
        (name, version), never producer-chosen.
      Icon: "SHARED VOCABULARY (U4 decision). Seed stays [iconSet, name]. Justification: the icon set name
        namespaces the icon (Lucide set + icon name is global); the DS icon registry and Lucide
        share that namespace, and the pilot imports Lucide icons only (@lucide/svelte in 35 files).
        ds-catalog mints icons of its registry and of the Lucide set; app producers never mint (a
        custom app icon set would carry its own app-specific set name, hence owned by the app and
        still seed-distinct). usesIcon edges target the owner-minted Icon id."
      DocPage: "PRODUCER-SCOPED (U4 decision). Seed becomes [producerId, routePath] (see node_id.seeds).
        Justification: route paths are producer-local (the same /components/button path denotes
        different pages in different docs sites); documentedIn edges never cross producers. Each
        producer documents its own routes; no shared DocPage exists."
  node_id:
    pattern: <prefix><first 32 hex of sha256(JCS(["ui@1", repoKey, nodeType, ...seed]))>, same
