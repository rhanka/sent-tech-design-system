      UiResource: one predeclared ui:// resource (definition); serving bindings (serverId, contentSha256,
        servedState) asserted by the serving side
      McpTool + rendersWith: tool definition with _meta.ui.resourceUri
      UiResource + callsTool: tool the resource declares as called (calledBy); app visibility alone is
        never evidence of a call (Astra 8)
      McpTool + servesCatalog: list_components and get_schema are connected to their RenderCatalog (Carbon M3)
      UiResource + builtFrom: no counterpart in the specification; ui provenance
      Component + exposedAs: per-component resource ui://sentropic/<a2uiComponentName>/v1 (PascalCase, Carbon M3)
      UiResource + supportsCatalog: shared renderer ui://sentropic/render/v1 for every component of the catalogue
  exposure_outputs:
    rule: "one extraction, three outputs at the same commit under the same profile pin: the engram
      fragment set, the A2UI catalogue and the ui:// manifest are projections of the same ui@1
      instances. The projector takes (committed fragments + digest-verified Elements contract/schema
      blobs + DS producer inputs); no output contains a value that is not an attribute of an
      instance or of a digest-verified blob. Whole-document canonical equality is required (not
      intersection-only); all three Elements components are imported with explicit source coverage
      (elements-metadata for index-excluded ones)."
    a2ui_catalog:
      path: generated/ui@1/<producerId>/a2ui/catalog.json
      from:
        - RenderCatalog
        - Component+listedIn
        - ComponentPort(element)
        - Contract(element)
        - Prop
        - Slot
        - Event
    ui_manifest:
      path: generated/ui@1/<producerId>/ui/manifest.json
      format: ui-exposure/v1
      from:
        - UiResource
        - McpTool
        - exposedAs
        - supportsCatalog
        - rendersWith
        - callsTool
        - builtFrom
        - servesCatalog
    gate: generated/ui@1/<producerId>/a2ui/catalog.json equals the elements catalog at the v2 URL after
      canonical sorting (whole document; v1.0 shape after L5a, v0.9.1 shape before)
  a2ui_query:
    rule: "the ontology is readable through an A2UI request (owner D3). Mend U2: ONE query
      implementation, the frozen app-context envelope via engram_catalog_for_target. The DS adapter
      receives the A2UI action ui.query, calls engram_catalog_for_target, then projects the frozen
      response onto an A2UI surface. No parallel local-compute query path exists; local computation
      is allowed ONLY for the static docs projection
      (generated/ui@1/<producerId>/navigation/<componentId>.json, built at build time)."
    request_frozen:
      input: "{ repo, commit, target (TargetSelector), question (ui tool param), direction?, relations?,
        depth? (impact only, capped), tokenBudget, cursor?, includeDiagnostics? }"
      target_selector: "ui TargetSelector (kind-discriminated, never bare {id}|{slug}): { kind:
        'ui-component', producerId, componentId } | { kind: 'ui-view', producerId, viewId } | {
        kind: 'ui-layout', producerId, layoutId } | { kind: 'ui-token', producerId,
        cssCustomPropertyName } | { kind: 'ui-theme', producerId, themeId }. Code targets resolve by
        (node_type, producerId, seed); the locator form { repo, file, exportSymbol } addresses the
        same node the identity bridge joins. The selector vocabulary is a ui-tool addition inside
        the frozen envelope; repo/commit/tokenBudget/cursor keep their frozen names and meanings
        (tokenBudget, not budget_tokens)."
      question: ui tool parameter selecting the relation set (composes | composed_by | views_using |
        missing_ports | impact | neighbours | ... per STUDY section 9.3 Q1-Q13); it restricts
        traversal, never changes the envelope.
      includeDiagnostics: "optional diagnostic request object. Coverage (which producers are indexed,
        their commits and counts, freshness) is NOT an envelope field; if the tool needs it, it asks
        for it here. OPEN QUESTION TO ENGRAM (U2): does engram accept includeDiagnostics coverage in
        v1, and what is its shape? Until engram sizes it, answers state coverage via indexedCommit +
        profileHash + graphId only (empty answer = uncovered, never unused)."
    transports:
      - "MCP tool engram_catalog_for_target (frozen app-context envelope: target -> items ordered,
        token-budgeted, commit-pinned, freshness = indexedCommit + profileHash, nextCursor, 6 error
        codes)"
      - "A2UI action message renderer_to_agent event.name = ui.query whose context is the same
        request object (v1.0 envelope: action rides renderer_to_agent.json)"
    response_envelope_frozen:
      success: "{ ok: true, tool: 'engram_catalog_for_target', repo, indexedCommit, graphId, profileHash,
        budget: { limitTokens, usedTokens }, items: ContextRecord[], nextCursor }"
      items: "ContextRecord[] as defined by the app-context contract: node identity + citations[]
        (source_file, source_location, commit). Items carry NO relations[] array; traversal edges
        are ContextRecord edge assertions with their own citations (the app-context relation-record
        pattern), projected by the adapter into the surface data model. Removed non-envelope fields:
        commit (renamed indexedCommit), source_hash (freshness is indexedCommit + profileHash),
        echoed cursor (nextCursor only), { id, node_type, label, relations } items shape, coverage
        (see includeDiagnostics)."
      errors: "the 6 frozen error codes: commit-not-indexed | target-not-found | target-ambiguous |
        cursor-invalid | profile-incompatible | budget-too-small. Errors use the same envelope (ok:
        false + error code), never a bespoke ui error shape."
    response_surface: "A2UI v1.0 surface projecting the frozen items: createSurface(surfaceId, catalogId
      ui-navigation/v1, components + dataModel inline per v1.0 single-message payloads) +
      updateDataModel(frozen response). ui-navigation/v1 is a RenderCatalog whose component types
      are UiItem (one ContextRecord + its citations). The adapter McpTool ui_query rendersWith
      UiResource ui://sentropic/ui-query/v1 (DS side, L11) is a THIN forwarder to
      engram_catalog_for_target, not a local traversal."
    tool: "McpTool ui_query rendersWith UiResource ui://sentropic/ui-query/v1; kind is a forwarder over
      engram_catalog_for_target (the r2 local_compute kind is DELETED by U2: a second implementation
      would drift from the graph tool)."
  bridges:
    pattern: a small bridge profile that requires both profiles, as engram's archi2-erd-bridge@1
      (storedIn, realizes); relations are declared with their own evidence, never matched by name
    proposed_profile: ui-bridge@1
    requires:
      - ui@1
      - app-context@1
    owner: engram authors ui-bridge@1, as for archi2-erd-bridge@1; the DS co-reviews; h2a signs at
      admission (engram E3)
    relation_types:
      usesDsComponent:
        source:
          profile: app-context@1
          type: Component
        target:
          profile: ui@1
          type: Component
        cardinality:
          source: 0..n
          target: 0..n
          status: declared
        presentation:
          encoding: arrow
        asserted_by: "consumer-side extraction: an import of a @sentropic/design-system-* export, resolved
          through generated/ui@1/<producerId>/barrel-exports.json to a componentId"
      implementsUiElement:
        source:
          profile: app-context@1
          type: Component
        target:
          profile: ui@1
          type: Component|ComposedView|ViewLayout
        cardinality:
          source: 0..1
          target: 0..n
          status: provisional
        presentation:
          encoding: arrow
        asserted_by: "locator equality ONLY (U1-b): app-context Component locator { repo, commit,
          source_file, export_symbol } equals the ui node locator (locatorRepo, locatorCommit,
          locatorFile, locatorSymbol) field for field, at the same indexed commit. Never from a
          name, never from a slug, never from an import. One ui code element has at most one
          app-context Component (source: 0..1); one app-context Component may have several ui code
          elements (target: 0..n), hence provisional. A ui node with no app-context counterpart
          (matched by locator or by usesDsComponent) is still a first-class ui instance; absence of
          the bridge never demotes it."
        target_types_note: Component, ComposedView and ViewLayout are the three code grains the identity
          covers. A view is a ComposedView when it composes other components, a ViewLayout when it
          is a page shell; the bridge preserves whichever grain the ui extractor minted. Prop, Slot,
          Event, Contract, Token, Theme, Icon, Package, PackageRelease, DocPage, RenderCatalog,
          UiResource, McpTool, PresentationForm have NO identity edge (U1-d).
      servedBy:
        source:
          profile: ui@1
          type: McpTool
        target:
          profile: app-context@1
          type: mcp_server
        cardinality:
          source: 0..n
          target: 1..n
          status: provisional
        presentation:
          encoding: footer
          on: source
          label: server
        asserted_by: the serving side (h2a module) with its own extraction; never the DS build
    non_relations:
      rendersDiagramProfile: "NOT a relation: a profile pin is not a navigable node (engram D1b).
        Component.rendersProfiles carries pins as an attribute."
      presentsViewKind: "NOT a relation (engram D1b): ComposedView.viewKind carries the
        diagram-view-schema@2 view-kind pin as an attribute; view-kind traversal is not a catalog
        query"
      ds_to_archi: "deferred: no direct DS-to-archi component bridge; archi links arrive via app-context
        (Astra 6)"
      no_cross_emission: "NOT a relation (U1-c): no bridge or in-profile relation links ui nodes to
        app-context nodes except usesDsComponent / implementsUiElement / servedBy. The ui skill
        never emits app-context node types; the app-context extractor never emits ui node types.
        Conformance gate: any fragment whose node_type is outside its profile's closed list fails."
      identity_via_name: "NOT a relation (U1-b): name, slug or import matching never asserts
        implementsUiElement. Only full locator equality asserts it."
  registration:
    state: NO engram catalog registration before the third-party registration contract + cluster-mesh
      discovery exist (owner D1). The ontology (profile + generator + fragments) is committed in the
      DS repo now; engram ingests committed fragments pinned to the DS commit (E7/E8).
    pattern: "engram app-context@1: profiles/app-context/v1/profile.yaml +
      src/ontology-guardian/app-context-registry.ts; every pin is derived from the profile file and
      checked for coherence before admission"
    proposed_profile_path: packages/ui-ontology/profiles/ui/v1/profile.json
    constants:
      namespace: sentropic-ds
      id: ui
      version: "1"
      canonicalRef: sentropic-ds:ui@1
      owner: sentropic-ds
      corpusRef: sentropic-ds:ui-conformance-corpus/1
    derived_pins:
      - rawSha256 (file bytes)
      - sourceCommit (DS release commit SHA; never the file hash)
      - contentDigest = hashOntologyProfile(normalized)
      - "pinsDigest = pinsDigestOf({ layers: [profilePin] })"
      - resultDigest = resultDigestOf(effective declarations)
      - corpusDigest
      - fragmentContractVersion (ui-fragments/1)
    acceptance_states:
      - draft-pinned (committed in the DS repo; this revision)
      - qualified (engram-ingested at a pinned commit)
      - discovered (cluster-mesh discovery)
    family: EXT with family-corpus receipt (engram E2); licence closure declared in the record
    versioning: additive change publishes 1.1 (non-breaking, checkProfileCompatibility); breaking change
      takes 2; a published version is never edited (engram E5)
    draft_content_digest: 90aa64383475611882a57ca6a739f418dc5a4e7fba2b56df541434b65ef442de
    digest_provenance: Pinned to RELEASED engram 0.27.0 (tag v0.27.0 = 566cbbd4, rhanka/engram), never
      to a feature-branch build (U3). Measured from scratchpad/ds-ui-ontology/ui.profile.draft.json
      (final r3 bytes) with parseOntologyProfile + validateOntologyProfile (0 errors) +
      normalizeOntologyProfile(...).profile_hash + hashOntologyProfile(parsed) +
      bundleProfile(profile) with registriesMode bindings-only (no second arg). Revision 3 changes
      only x_ui (locator, seeds, fragments path, a2ui v1.0 pin, frozen query envelope,
      implementsUiElement), all outside profile_hash, so profile_hash is identical to the r2 value
      on 0.27.0 (90aa6438...); raw sha256, hashOntologyProfile(parsed) and bundle digest are
      re-measured from the final r3 bytes and stated in STUDY section 10.3 (they are not embedded
      here because any x_ui edit would invalidate them). See STUDY section 10.3 for the command.
    raw_sha256_note: computed on the final file bytes by the measuring command; stored in the
      manifest/receipt, not in x_ui (x_ui is excluded from profile_hash but included in the raw
      bytes)
