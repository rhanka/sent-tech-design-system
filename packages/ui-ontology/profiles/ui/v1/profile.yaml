id: ui
version: "1"
default_language: en
presentation_vocabulary: diagram-notation@1
node_types:
  Component:
    aliases:
      - ui component
      - design-system component
      - catalog component
    registry: components
    source_backed: true
    status_policy: hardenable
    visual_encoding:
      shape: square
      fill: solid
      border: bold
      color_hex: "#EA580C"
    presentation:
      role: card
      nature: component
      icon: component
      kicker:
        attribute: category
        values:
          action: ACTION
          chat: CHAT
          data: DATA
          feedback: FEEDBACK
          form: FORM
          layout: LAYOUT
          navigation: NAVIGATION
          overlay: OVERLAY
          other: OTHER
        default: COMPONENT
      holds:
        - card
  ComponentPort:
    aliases:
      - framework port
      - implementation
      - delivery
    source_backed: true
    status_policy: hardenable
    visual_encoding:
      shape: square
      fill: hollow
      border: normal
      color_hex: "#F97316"
    presentation:
      role: card
      nature: component
      icon: code
      kicker:
        attribute: framework
        values:
          svelte: SVELTE
          react: REACT
          vue: VUE
          angular: ANGULAR
        default: ELEMENT
  Framework:
    aliases:
      - framework
      - build target
    registry: frameworks
    source_backed: true
    status_policy: reference
    visual_encoding:
      shape: hexagon
      fill: solid
      border: bold
      color_hex: "#7C3AED"
    presentation:
      role: card
      nature: component
      icon: layers
      kicker: FRAMEWORK
  Contract:
    aliases:
      - component contract
      - derived contract
      - contract cell
    source_backed: true
    status_policy: hardenable
    visual_encoding:
      shape: diamond
      fill: solid
      border: bold
      color_hex: "#2563EB"
    presentation:
      role: flow-node
      nature: data
      variant: document
  Prop:
    aliases:
      - property
      - input
      - attribute
    source_backed: true
    status_policy: hardenable
    visual_encoding:
      shape: diamond
      fill: hollow
      border: normal
      color_hex: "#3B82F6"
    presentation:
      role: entity-table
      nature: data
      icon: sliders
  Slot:
    aliases:
      - slot
      - snippet
      - children
      - content projection
    source_backed: true
    status_policy: hardenable
    visual_encoding:
      shape: diamond
      fill: hollow
      border: bold
      color_hex: "#1D4ED8"
    presentation:
      role: entity-table
      nature: data
      icon: square-dashed
  Event:
    aliases:
      - event
      - output
      - emit
      - action
    source_backed: true
    status_policy: hardenable
    visual_encoding:
      shape: triangle
      fill: hollow
      border: normal
      color_hex: "#DC2626"
    presentation:
      role: entity-table
      nature: data
      icon: zap
  TokenSet:
