  query_aliases:
    deprecatedBy: inverse of `replaces`; query alias, never asserted (engram E9)
    composedBy: inverse of `composes`; query alias
    portOf: inverse of `portedTo`; query aliases
  derived_queries:
    missing_ports: "never stored (engram D2). Derived at query time as a set difference: supported
      Frameworks minus Frameworks with `portedTo`/`targetsFramework` at the pinned commit, split by
      the parity map (missing vs no-counterpart) read from the committed index. Same rule for app
      producers: frameworks the producer supports minus frameworks with ports."
    consumed_by: derived projection of the bridge usesDsComponent (+ PackageRelease manifest
      dependencies); never stored. Empty means uncovered, not unused.
    port_completeness: ports with `implementsContract` whose Contract.completeness != complete; ports
      with no contract edge answer unknown, never incomplete.
  fragments:
    frozen_path: generated/ui@1/<producerId>/fragments/<fragmentSlug>.json +
      generated/ui@1/<producerId>/manifest.json + generated/ui@1/manifest.json (root). The skill
      writes exactly this layout in every indexed repo (DS or app); h-cond architect skill reads the
      manifest, never a guessed path. fragmentSlug is the componentId for component fragments and
      _foundation/_views/_packages/_exposure for shared nodes. ui@1 carries the version inside the
      path so a future ui@2 lands beside it.
    rule: "generated/ui@1 fragments shards are Git/diff storage only. validateProfileExtraction and
      graph assembly run over the MERGED commit extraction assembled from
      generated/ui@1/manifest.json (all shards + registry seeds; nodes before edges). Engram caches
      shard payloads by sha256 and validates/builds the union per commit (Carbon B1). Locator note
      (U1): locatorCommit equals sourceCommit, so locator-bearing fragments rewrite their locator
      lines every commit; engram caches locator-bearing shards on semantic content (nodes/edges
      minus locatorCommit), not on raw sha. An unrelated commit still rewrites only the manifest
      plus locatorCommit lines, never a semantic assertion."
    citations: "every non-registry node and every edge carries citations: [{ source_file,
      source_location }] (citation_policy requires source_file; source_location carries the old
      source_line form)"
    evidence: "every node and edge carries evidence_refs; every extraction carries evidence:
      OntologyEvidenceRecord[]; registry-seeded nodes carry evidence_refs from the index entry
      (evidence check runs before the registry exemption, Carbon B2)"
    provenance_envelope: Extraction.provenance { source_owner, source_id, observed_at, source_hash,
      adapter_version } (required strings)
    registry_ids: P1 mints the u* ids directly with registry_id + registry_record_id; raw
      registryRecordsToExtraction ids (registry_components_*) are never merged into the fragment
      graph
    dedup: forbid buildMerge/deduplicateByLabel on ui extractions (deterministic ids); member
      labels/dedupKey are qualified by node_type (prop:navigationPanel vs slot:navigationPanel)
    assertion_vs_snapshot: assertion content is byte-stable across commits EXCEPT locatorCommit
      (locator-bearing code elements restate sourceCommit per commit by design, U1); the indexed
      commit lives in manifest.json (sourceCommit + fragmentSetDigest) and in locatorCommit lines.
      An unrelated commit rewrites only the manifest plus locatorCommit lines, never a semantic
      assertion. Absence at the new commit is the retraction.
  a2ui:
    version: v1.0
    status: "A2UI v1.0 is the current specification (Version: 1.0, Status: Current, Created: Nov 20
      2025, Last Updated: Jun 8 2026; Google first-stable announcement Nov 11 2026). Owner r2: move
      to v1.0 BEFORE the first projection. The DS JSON render standard / elements catalog migration
      is prerequisite lot L5a; the v0.9.1 pin is retired by this revision."
    sources:
      - https://a2ui.org/specification/v1.0-a2ui/
      - https://a2ui.org/specification/v1.0/schemas/
      - https://a2ui.org/specification/v1.0-evolution-guide/
      - https://a2ui.org/specification/v1.0-basic-catalog-implementation-guide/
      - https://a2ui.org/specification/v1.0-a2ui-extension-specification/
      - https://github.com/a2ui-project/a2ui/blob/main/specification/v1_0/json/common_types.json
      - https://github.com/a2ui-project/a2ui/blob/main/specification/v1_0/json/catalog_definition.json
      - https://github.com/a2ui-project/a2ui/blob/main/specification/v1_0/json/agent_to_renderer.json
      - https://github.com/a2ui-project/a2ui/blob/main/specification/v1_0/json/renderer_to_agent.json
      - https://a2ui.org/guides/mcp-overview/
      - "v0.9.1 sources retired (kept for migration diff only):
        https://a2ui.org/specification/v0.9.1-a2ui/, https://a2ui.org/specification/v0.9.1/schemas/"
    reused_verbatim:
      catalog_keys:
        - $schema
        - $id
        - catalogId
        - title
        - description
        - components
        - functions
        - $defs
      catalog_defs:
        - anyComponent
        - theme
        - CatalogComponentCommon
      common_types:
        - ComponentCommon (composed at envelope level; individual catalog definitions MUST NOT
          redundantly wrap ComponentCommon/FunctionCommon via allOf)
        - ComponentId
        - ChildList
        - DataBinding {@path} (v1.0 @-prefixed; plain objects with path/call keys are literals)
        - DynamicString
        - DynamicNumber
        - DynamicBoolean
        - DynamicStringList
        - DynamicValue
        - FunctionCall {@call, args} (v1.0 @-prefixed)
        - Action
        - Checkable
        - CheckRule
        - AccessibilityAttributes (v1.0 via @accessibility)
      component_object:
        - id (unprefixed, structural identity)
        - component (unprefixed, discriminator)
        - "envelope mixins (v1.0 @-prefixed): @catalogId, @accessibility, @metadata, @checks"
      negotiation:
        - supportedCatalogIds
        - inlineCatalogs
        - acceptsInlineCatalogs
      messages_named_only:
        - agent_to_renderer envelope (v1.0 wire rename; v0.9.1 bare message names retired)
        - "createSurface (v1.0 single-message payloads: components + dataModel may ride inline)"
        - updateComponents
        - updateDataModel
        - deleteSurface
        - callRendererFunction
        - agentFunctionResponse
        - "renderer_to_agent envelope: action + callAgentFunction/rendererFunctionResponse"
        - error
    used_by_ds_catalogue_today:
      - ComponentCommon
      - CatalogComponentCommon
      - anyComponent
      - theme
    reserved_not_used_today:
      - ComponentId
      - ChildList
      - DataBinding
      - Dynamic*
      - FunctionCall
      - Action
      - Checkable
    ds_catalog:
      current: "https://design-system.sent-tech.ca/catalogs/elements/v1/catalog.json (A2UI v0.9.1, 3
        components: BarChart, BpmnCanvas, DecisionDossier)"
      v1_target: "https://design-system.sent-tech.ca/catalogs/elements/v2/catalog.json (A2UI v1.0; catalog
        URL takes the new major per owner r2). $id = catalogId = v2 URL (v1.0 rule: both set to the
        same URI, catalogId a string identifier conventionally URI-shaped). The v1 URL stays pinned
        for v0.9.1 consumers; L5a migrates catalog.json, the 3 standalone schemas, the
        render-envelope validator and the 7 h2a render tools, then re-pins
        a2uiVersion/protocolVersion."
    mapping:
      RenderCatalog: "catalog document; catalogId = $id (v1.0: catalog definition per
        catalog_definition.json; protocolVersion 1.0; catalogId a string identifier, not a
        resolvable URI)"
      Component + listedIn: components.<a2uiComponentName>; per-component @catalogId mixing supported
        (explicit @catalogId else surface default catalogId else resolution error, no fallback to
        capabilities)
      ComponentPort(channel=element): x-sentropic.element, x-sentropic.engine, x-sentropic.fallback
      Contract(channel=element): the component schema; x-sentropic.contract; x-sentropic.schema
      Prop: one property of the component schema; value type per a2uiValueType; DataBinding positions use
        {@path}, FunctionCall positions use {@call, args} (v1.0); the schema body lives in the
        digest-addressed blob (contract), never retyped
      Slot: one property typed ComponentId (single) or ChildList (list or template) in the catalog
        definition; the property name is kept
      Event: x-sentropic.events intent today; a property typed Action with event.name when a2uiAction =
        event (v1.0 actions ride renderer_to_agent; bidirectional function RPC via
        callRendererFunction/callAgentFunction)
      ComposedView: "surface template: updateComponents adjacency list with one root (v1.0 createSurface
        may carry components + dataModel inline)"
      Theme: "$defs/theme { themeId } (v1.0: theme colours removed from the protocol; styling comes from
        the target framework native theme)"
      supportsCatalog: supportedCatalogIds advertised by a renderer (negotiation term unchanged in v1.0)
    dedicated_resources: "PascalCase of the a2uiComponentName: ui://sentropic/<a2uiComponentName>/v1
      with tool render_<a2uiComponentName> (live h2a spelling, Carbon M3)"
  mcp_apps:
    version: 2026-01-26 (Stable)
    extension_id: io.modelcontextprotocol/ui
    sources:
