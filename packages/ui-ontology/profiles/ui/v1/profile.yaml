      - token layer
      - token group
      - token set
    source_backed: true
    status_policy: hardenable
    visual_encoding:
      shape: box
      fill: solid
      border: bold
      color_hex: "#059669"
    presentation:
      role: entity-table
      nature: data
      icon: palette
  Token:
